; PlatformIO project for InkQuest, an interactive-fiction runner for the
; Xteink X4/X3 (ESP32-C3). The complete device layer (real HAL + vendored SDK
; hardware libraries) comes from inkkit, pinned below; no freeink-sdk wiring.
;
; Off-hardware verification: the portable story core is unit-tested with a host
; compiler (test/host/run.sh) and the device layer is compile-checked against
; stub HAL headers (test/device/compile_check.sh). Both run in CI, alongside
; real xteink_x4 / xteink_x3 firmware builds.
;
; Note: run pio environments one at a time (pio run -e <env>); concurrent pio
; invocations race on the shared ~/.platformio package directory.

[platformio]
default_envs = xteink_x4

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv

lib_deps =
  ; Canonical inkkit pin: the complete device layer (HAL + vendored SDK).
  https://github.com/mohitagw15856/inkkit.git#v0.1.0-rc1

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer to keep RAM headroom on the ESP32-C3.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1

build_unflags =
  -std=gnu++11

[env:xteink_x4]
extends = base

[env:xteink_x3]
extends = base
; The X3 shares the ESP32-C3 and firmware; the smaller panel is handled at
; runtime by the inkkit device layer, so the two environments are identical
; and exist to ship a named .bin per target.
