; PlatformIO project for InkQuest, an interactive-fiction runner for the
; Xteink X4/X3 (ESP32-C3). The device layer is borrowed from inkkit; the SDK's
; hardware libraries (freeink-sdk: Hal* / EInkDisplay / InputManager / ...) must
; be supplied by the build environment, exactly as for any inkkit-based firmware.
;
; Off-hardware verification does not use PlatformIO at all: the portable story
; core is unit-tested with a host compiler (test/host/run.sh) and the device
; layer is compile-checked against stub HAL headers (test/device/compile_check.sh).
; Both run in CI. `pio run -e xteink` is the real on-hardware build.

[platformio]
default_envs = xteink

[env:xteink]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv

lib_deps =
  ; Shared device HAL. Pin to a tag/commit in a real deployment.
  https://github.com/mohitagw15856/inkkit.git
  ; The freeink-sdk hardware libraries (Hal* display/gpio/storage/power) are
  ; provided here in a real build, e.g. as submodule symlinks:
  ;   EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  ;   InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  ;   SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  ;   PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  ; See docs/HARDWARE_TESTING.md and docs/INKKIT_GAPS.md.

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Single framebuffer to keep RAM headroom on the ESP32-C3.
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1

build_unflags =
  -std=gnu++11
