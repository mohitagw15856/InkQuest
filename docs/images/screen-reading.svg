<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 312" width="300" height="312" role="img" aria-label="InkQuest reading screen showing passage text and three choices, one selected">
  <rect x="0" y="0" width="300" height="312" rx="24" fill="#262320"/>
  <rect x="12" y="12" width="276" height="288" rx="8" fill="#f5f1e8"/>

  <rect x="12" y="12" width="276" height="30" fill="#1a1a1a"/>
  <text x="24" y="33" font-family="'DejaVu Sans Mono', monospace" font-size="14" fill="#f5f1e8">The Lighthouse Keeper</text>

  <g font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a">
    <text x="24" y="66">Halfway up the tower a locked</text>
    <text x="24" y="84">door bars the way to the lamp.</text>
    <text x="24" y="102">A brass dial waits, worn smooth</text>
    <text x="24" y="120">by generations of thumbs.</text>
  </g>

  <g font-family="'DejaVu Sans Mono', monospace" font-size="13">
    <rect x="18" y="150" width="264" height="24" fill="#1a1a1a"/>
    <text x="26" y="167" fill="#f5f1e8">&gt; Enter the signal room</text>
    <text x="26" y="197" fill="#1a1a1a">&gt; Search the keeper's desk</text>
    <text x="26" y="227" fill="#1a1a1a">&gt; Back down the stair</text>
  </g>

  <g fill="#262320">
    <circle cx="60" cy="286" r="6"/>
    <circle cx="90" cy="286" r="6"/>
    <circle cx="210" cy="286" r="6"/>
    <circle cx="240" cy="286" r="6"/>
  </g>
</svg>
