<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 312" width="300" height="312" role="img" aria-label="InkQuest library screen showing a list of stories with one selected">
  <rect x="0" y="0" width="300" height="312" rx="24" fill="#262320"/>
  <rect x="12" y="12" width="276" height="288" rx="8" fill="#f5f1e8"/>

  <!-- title bar -->
  <rect x="12" y="12" width="276" height="30" fill="#1a1a1a"/>
  <text x="24" y="33" font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#f5f1e8">InkQuest Library</text>

  <g font-family="'DejaVu Sans Mono', monospace" font-size="14">
    <!-- selected row (inverted) -->
    <rect x="18" y="58" width="264" height="26" fill="#1a1a1a"/>
    <text x="26" y="76" fill="#f5f1e8">The Lighthouse Keeper  *</text>

    <text x="26" y="110" fill="#1a1a1a">The Clockwork Garden</text>
    <text x="26" y="140" fill="#1a1a1a">Signal Lost  *</text>
    <text x="26" y="170" fill="#1a1a1a">Tomb of Ashfall</text>
    <text x="26" y="200" fill="#1a1a1a">Nine Doors</text>
  </g>

  <text x="26" y="250" font-family="'DejaVu Sans Mono', monospace" font-size="11" fill="#6a6a6a">*  saved progress</text>

  <!-- buttons -->
  <g fill="#262320">
    <circle cx="60" cy="286" r="6"/>
    <circle cx="90" cy="286" r="6"/>
    <circle cx="210" cy="286" r="6"/>
    <circle cx="240" cy="286" r="6"/>
  </g>
</svg>
