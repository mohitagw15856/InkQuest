<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="InkQuest: interactive fiction for your pocket e-ink reader">
  <defs>
    <pattern id="paperdots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1a1a1a" opacity="0.06"/>
    </pattern>
    <radialGradient id="lantern" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#e8a24a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#e8a24a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8a24a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- paper background -->
  <rect width="1280" height="400" fill="#f5f1e8"/>
  <rect width="1280" height="400" fill="url(#paperdots)"/>
  <rect x="8" y="8" width="1264" height="384" rx="18" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- left: wordmark + taglines -->
  <g>
    <!-- small logo mark -->
    <g transform="translate(84,150) scale(0.42)">
      <g fill="none" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M120 196 L120 140"/>
        <path d="M120 140 C120 112, 78 118, 74 92"/>
        <path d="M120 140 C120 112, 162 118, 166 92"/>
      </g>
      <g fill="#1a1a1a">
        <circle cx="120" cy="196" r="13"/>
        <circle cx="74" cy="86" r="15"/>
      </g>
      <circle cx="166" cy="86" r="15" fill="#f5f1e8" stroke="#1a1a1a" stroke-width="6"/>
    </g>

    <text x="150" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#1a1a1a" letter-spacing="1">InkQuest</text>
    <text x="152" y="224" font-family="Georgia, serif" font-size="27" fill="#3a3a3a" font-style="italic">Interactive fiction for your pocket e-ink reader.</text>

    <!-- keyword chips -->
    <g font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1a1a1a">
      <g transform="translate(152,262)">
        <rect x="0" y="0" width="168" height="34" rx="17" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <text x="18" y="23">Twine + Ink</text>
      </g>
      <g transform="translate(332,262)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <text x="18" y="23">Xteink X4/X3</text>
      </g>
      <g transform="translate(494,262)">
        <rect x="0" y="0" width="132" height="34" rx="17" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <text x="18" y="23">ESP32-C3</text>
      </g>
    </g>
    <text x="152" y="332" font-family="Georgia, serif" font-size="19" fill="#5a5a5a">Compile a story on your desktop. Live a hundred lives on the train.</text>
  </g>

  <!-- right: the device showing a reading screen -->
  <g transform="translate(900,58)">
    <rect x="-14" y="-14" width="308" height="312" rx="26" fill="#262320"/>
    <rect x="0" y="0" width="280" height="284" rx="10" fill="#f5f1e8"/>
    <rect x="0" y="0" width="280" height="284" rx="10" fill="url(#lantern)"/>

    <!-- title bar (inverted) -->
    <rect x="0" y="0" width="280" height="30" rx="10" fill="#1a1a1a"/>
    <rect x="0" y="14" width="280" height="16" fill="#1a1a1a"/>
    <text x="12" y="21" font-family="'DejaVu Sans Mono', monospace" font-size="14" fill="#f5f1e8">The Lighthouse Keeper</text>

    <!-- body text -->
    <g font-family="'DejaVu Sans Mono', monospace" font-size="13.5" fill="#1a1a1a">
      <text x="12" y="58">The lamp is cold and the</text>
      <text x="12" y="78">bell is ringing on the reef.</text>
      <text x="12" y="98">A ship is breaking up in</text>
      <text x="12" y="118">the dark below.</text>
    </g>

    <!-- choices -->
    <g font-family="'DejaVu Sans Mono', monospace" font-size="13.5">
      <rect x="6" y="150" width="268" height="24" fill="#1a1a1a"/>
      <text x="14" y="167" fill="#f5f1e8">&gt; Light the great lamp</text>
      <text x="14" y="197" fill="#1a1a1a">&gt; Run for the lifeboat</text>
      <text x="14" y="227" fill="#1a1a1a">&gt; Search the keeper's desk</text>
    </g>

    <!-- buttons -->
    <g fill="#262320">
      <circle cx="40" cy="270" r="7"/>
      <circle cx="70" cy="270" r="7"/>
      <circle cx="210" cy="270" r="7"/>
      <circle cx="240" cy="270" r="7"/>
    </g>
  </g>
</svg>
