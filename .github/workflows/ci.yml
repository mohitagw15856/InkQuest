name: CI

on:
  push:
  pull_request:

jobs:
  companion:
    name: Companion (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        working-directory: companion
        run: python -m pytest -q
      - name: Compile the demo story
        working-directory: companion
        run: |
          python -m inkquest validate ../stories/the-lighthouse-keeper/the-lighthouse-keeper.twee
          python -m inkquest compile ../stories/the-lighthouse-keeper/the-lighthouse-keeper.twee -o /tmp/demo.iqs
          cmp /tmp/demo.iqs ../stories/the-lighthouse-keeper/the-lighthouse-keeper.iqs
          echo "committed .iqs matches a fresh compile"

  host-core:
    name: Core unit tests (host C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone inkkit (device HAL dependency, canonical pin)
        run: git clone --depth 1 --branch v0.1.0-rc1 https://github.com/mohitagw15856/inkkit.git ../Inkkit
      - name: Build and run host tests
        env:
          INKKIT: ${{ github.workspace }}/../Inkkit
        run: ./test/host/run.sh

  device-compile:
    name: Device layer compile check (stub HAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone inkkit (device HAL dependency, canonical pin)
        run: git clone --depth 1 --branch v0.1.0-rc1 https://github.com/mohitagw15856/inkkit.git ../Inkkit
      - name: Compile-check the ARDUINO device layer
        env:
          INKKIT: ${{ github.workspace }}/../Inkkit
        run: ./test/device/compile_check.sh

  firmware:
    name: Firmware build (PlatformIO, ESP32-C3 toolchain)
    runs-on: ubuntu-latest
    # Builds the shippable firmware for both Xteink targets. The complete
    # device layer (real HAL + vendored SDK hardware libraries) comes from
    # inkkit, pinned in platformio.ini; on-device behaviour is tracked in
    # docs/HARDWARE_TESTING.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      # Environments build one at a time: pio package installs are not safe to
      # run concurrently against a shared ~/.platformio.
      - name: Build X4 firmware
        run: pio run -e xteink_x4
      - name: Build X3 firmware
        run: pio run -e xteink_x3
      - name: Upload X4 artefact
        uses: actions/upload-artifact@v4
        with:
          name: inkquest-xteink_x4-firmware
          path: .pio/build/xteink_x4/firmware.bin
          if-no-files-found: error
      - name: Upload X3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: inkquest-xteink_x3-firmware
          path: .pio/build/xteink_x3/firmware.bin
          if-no-files-found: error
