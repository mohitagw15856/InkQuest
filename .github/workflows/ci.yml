name: CI

on:
  push:
  pull_request:

jobs:
  companion:
    name: Companion (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        working-directory: companion
        run: python -m pytest -q
      - name: Compile the demo story
        working-directory: companion
        run: |
          python -m inkquest validate ../stories/the-lighthouse-keeper/the-lighthouse-keeper.twee
          python -m inkquest compile ../stories/the-lighthouse-keeper/the-lighthouse-keeper.twee -o /tmp/demo.iqs
          cmp /tmp/demo.iqs ../stories/the-lighthouse-keeper/the-lighthouse-keeper.iqs
          echo "committed .iqs matches a fresh compile"

  host-core:
    name: Core unit tests (host C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone inkkit (device HAL dependency)
        run: git clone --depth 1 https://github.com/mohitagw15856/inkkit.git ../Inkkit
      - name: Build and run host tests
        env:
          INKKIT: ${{ github.workspace }}/../Inkkit
        run: ./test/host/run.sh

  device-compile:
    name: Device layer compile check (stub HAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone inkkit (device HAL dependency)
        run: git clone --depth 1 https://github.com/mohitagw15856/inkkit.git ../Inkkit
      - name: Compile-check the ARDUINO device layer
        env:
          INKKIT: ${{ github.workspace }}/../Inkkit
        run: ./test/device/compile_check.sh

  firmware:
    name: Firmware build (PlatformIO, ESP32-C3 toolchain)
    runs-on: ubuntu-latest
    # Builds the firmware for the real esp32-c3 target with the espressif32
    # toolchain, using the inert stub HAL in test/stubs/hal in place of the
    # freeink-sdk hardware libraries (which are not fetched in CI). This proves
    # the firmware compiles and links end to end; the shippable on-device image
    # is `pio run -e xteink` with the real SDK. See docs/HARDWARE_TESTING.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware (stub HAL)
        run: pio run -e ci
